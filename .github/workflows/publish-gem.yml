name: Publish Gem

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set RubyGems API key
        run: |
          echo "::add-mask::${{ secrets.PAGES_GEM_PUBLISH }}"
          echo "GEM_HOST_API_KEY=${{ secrets.PAGES_GEM_PUBLISH }}" >> $GITHUB_ENV
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Build gem
        run: |
          gem build jekyll-theme-zapocalypse.gemspec
      - name: Publish
        run: gem push $(ls jekyll-theme-zapocalypse-*.gem)
