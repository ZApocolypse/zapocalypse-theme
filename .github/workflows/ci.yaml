name: Test Theme
on:
  push:
  pull_request:
    types: [opened, synchronize]
jobs:
  build:
    runs-on: ubuntu-latest
    name: script/cibuild
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install dependencies
        run: |
            cd /home/runner/work/zapocalypse-theme/zapocalypse-theme/example-site
            bundle install
            cd ..
      - name: build
        run: script/bootstrap
      - name: test
        run: script/cibuild
